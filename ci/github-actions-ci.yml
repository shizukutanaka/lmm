name: ci

# NOTE: this cannot live in .github/workflows/ in this repo — pushes from the
# Claude GitHub App are rejected without `workflows` permission (verified: the
# remote refuses the push). Copy it there yourself to enable CI:
#     mkdir -p .github/workflows && cp ci/github-actions-ci.yml .github/workflows/ci.yml
#
# lmm is a single zero-dependency file, so CI needs no install step and no
# cache — it exists to enforce two claims the README makes: the test suite
# passes, and the tool really does run on Python 3.8+.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor the README promises; the newest entry catches
        # deprecations before they become breakage.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m py_compile lmm.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The zero-config smoke test and the config.example.json sync check used
      # to live here as separate steps. They are now TestCliSmoke in the suite
      # above, so they run for developers too instead of only in CI.
      - name: Every import resolves to the standard library
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          src = pathlib.Path("lmm.py").read_text(encoding="utf-8")
          names = set()
          for node in ast.walk(ast.parse(src)):
              if isinstance(node, ast.Import):
                  names.update(a.name.split(".")[0] for a in node.names)
              elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                  names.add(node.module.split(".")[0])
          stdlib = getattr(sys, "stdlib_module_names", None)
          assert stdlib, "needs Python 3.10+ to introspect the stdlib list"
          extra = sorted(n for n in names if n not in stdlib and n != "lmm")
          print("imports:", ", ".join(sorted(names)))
          if extra:
              sys.exit("non-stdlib imports found: %s" % extra)
          print("all imports are stdlib")
          PY
