name: ci

# NOTE: this cannot live in .github/workflows/ when pushed from the Claude
# GitHub App — the remote rejects such pushes without `workflows` permission
# (verified: both `git push` and the contents API refuse it). Copy it there
# yourself to enable the matrix:
#     mkdir -p .github/workflows && cp ci/github-actions-ci.yml .github/workflows/ci.yml
#
# This complements `.github/workflows/guard.yml`, which already runs
# `lmm selftest --guard` — the tool proving itself on one interpreter. What is
# missing from that gate is the two claims the README makes about the *suite*:
# that it passes, and that lmm really runs on Python 3.8+. That is this file.
#
# lmm has no dependencies, so CI needs no install step and no cache.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor the README promises; the newest entry catches
        # deprecations before they become breakage.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # All three modules, not just the entry point: after the backend /
      # frontend split, compiling lmm.py alone proves almost nothing.
      - name: Byte-compile every module
        run: python -m py_compile lmm.py backend.py frontend.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          LMM_SELFTEST_SKIP_LIVE: "1"

      # The zero-config smoke test, the config.example.json sync check and the
      # stdlib-only import check used to live here as separate steps. They are
      # now TestCliSmoke and TestPackaging in the suite above, so they run for
      # developers too instead of only in CI — and the import check now scans
      # every module rather than the one that no longer holds the imports.
